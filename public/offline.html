<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Verta</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #081b33;
        color: #fff;
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
      }
      .card { max-width: 360px; text-align: center; }
      .logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 14px;
        background: #c9a227;
        color: #081b33;
        font-weight: 800;
        font-size: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 24px; color: rgba(255, 255, 255, 0.7); line-height: 1.5; }
      button {
        background: #c9a227;
        color: #081b33;
        border: 0;
        border-radius: 10px;
        padding: 12px 20px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">V</div>
      <h1>Du er offline</h1>
      <p>
        Vi får ikke kontakt med internett akkurat nå. Sjekk forbindelsen og
        prøv igjen — sidene du allerede har åpnet fungerer fortsatt.
      </p>
      <button onclick="location.reload()">Prøv igjen</button>
    </div>
  </body>
</html>
