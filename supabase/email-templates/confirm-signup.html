<!--
  Supabase → Authentication → Emails → "Confirm signup"
  Emne: Bekreft Verta-kontoen din
  Variabler: {{ .ConfirmationURL }}
-->
<div style="margin:0;padding:0;background:#f5f7fa;">
  <div style="max-width:520px;margin:0 auto;padding:32px 16px;font-family:Helvetica,Arial,sans-serif;color:#081b33;">
    <div style="text-align:center;margin-bottom:24px;">
      <span style="font-size:24px;font-weight:700;letter-spacing:-0.5px;color:#081b33;">Verta</span>
    </div>
    <div style="background:#ffffff;border-radius:12px;padding:32px;border:1px solid #e0e7ff;">
      <h1 style="margin:0 0 16px;font-size:20px;color:#081b33;">Bekreft e-posten din</h1>
      <p style="font-size:15px;line-height:1.6;margin:0 0 24px;">
        Velkommen til Verta! Klikk på knappen under for å bekrefte
        e-postadressen din og fullføre registreringen.
      </p>
      <div style="text-align:center;margin:0 0 8px;">
        <a href="{{ .ConfirmationURL }}"
          style="display:inline-block;background:#d8a66a;color:#081b33;font-weight:600;font-size:15px;text-decoration:none;padding:12px 28px;border-radius:8px;">
          Bekreft konto
        </a>
      </div>
      <p style="font-size:13px;line-height:1.6;color:#4b5563;margin:16px 0 0;">
        Hvis du ikke opprettet en konto, kan du se bort fra denne e-posten.
      </p>
    </div>
    <p style="text-align:center;margin-top:24px;font-size:12px;color:#4b5563;">
      Verta · Full kontroll over dine utleieeiendommer
    </p>
  </div>
</div>
